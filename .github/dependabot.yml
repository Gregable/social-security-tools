version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security updates only. A limit of 0 turns off routine version-update
    # PRs, but security updates still honor the groups below.
    open-pull-requests-limit: 0
    groups:
      # Storybook packages must move in lockstep; bumping a subset leaves
      # mixed majors that fail to load presets.
      storybook:
        applies-to: security-updates
        patterns:
          - storybook
          - "@storybook/*"
      # @vitest/coverage-v8 pins an exact vitest peer version.
      vitest:
        applies-to: security-updates
        patterns:
          - vitest
          - "@vitest/*"
